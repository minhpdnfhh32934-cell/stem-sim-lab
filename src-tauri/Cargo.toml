[package]
name = "stem-sim-lab"
version = "0.2.0"
description = "STEM Sim Lab — offline STEM simulator (desktop shell)"
authors = ["STEM Sim Lab team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "stem_sim_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Exactly one edition must be enabled (PROMPT_PHAN_2 A2):
# - edition-main: students 18+, Gemini (default) + optional Claude
# - edition-pilot: supervised high-school pilot, Claude only; Gemini code is not compiled in
#   (build with `--no-default-features --features edition-pilot`)
default = ["edition-main"]
edition-main = []
edition-pilot = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
thiserror = "2.0.21"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
ed25519-dalek = "2.1.1"
sha2 = "0.10.9"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2"
dirs = "7"

[profile.release]
# Small installer, fast startup (target: installer < 80 MB).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
