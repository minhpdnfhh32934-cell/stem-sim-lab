name: Security checks

# Known-vulnerable dependencies and leaked secrets (audit SEC-02/SEC-08, 2026-10-13).
# - npm audit: production and development dependencies, fails on high or critical.
# - cargo audit: RustSec advisories for src-tauri/Cargo.lock. Vulnerabilities and unsound or
#   yanked crates fail; "unmaintained" notices are printed as warnings. Two reviewed Linux-only
#   GTK3 advisories are ignored in src-tauri/.cargo/audit.toml (2026-10-14).
# - gitleaks: secrets anywhere in the git history.
# - dependency review (pull requests): blocks a change that adds a vulnerable package.
# A green run is not proof that the app is secure; it only means these checks found nothing.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1' # Mondays 09:17 Vietnam time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # Fails on any vulnerability and on any unsound or yanked crate. The reviewed exceptions
      # (Linux-only GTK3 crates) are listed, with reasons, in src-tauri/.cargo/audit.toml.
      - run: cargo audit --deny unsound --deny yanked
        working-directory: src-tauri

  gitleaks:
    name: Secrets in history (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
