name: Release (Windows installer)

# Builds the Windows installers and the signed in-app update, and publishes them.
#
# - Actions → "Release (Windows installer)" → "Run workflow":
#     publish = true  → GitHub Release v<package.json version> (installers + in-app update);
#                       every installed app offers the update (menu ☰ → Kiểm tra cập nhật).
#     publish = false → only builds; files are in the run's Artifacts.
# - Pushing a tag v<version> publishes too.
#
# Versions (docs/RELEASE.md): package.json = web part, src-tauri/tauri.conf.json + Cargo.toml
# = native part. Bump only package.json for interface/simulation changes (in-app update);
# bump the native version as well when Rust code changes (needs the installer once).
#
# Microsoft Store (docs/STORE.md): the same executable is also wrapped in an MSIX package
# (artifact "simlab-store") once store/identity.json is filled in. With the repository variable
# STORE_SUBMIT = true and the PARTNER_CENTER_* secrets, a published release is also submitted to
# the Store (Microsoft certifies it, then the Store updates its users).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Phát hành bản mới (app sẽ tự thấy bản cập nhật)'
        type: boolean
        default: true
      notes:
        description: 'Ghi chú thay đổi (hiện trong app, tiếng Việt)'
        type: string
        default: ''
      required:
        description: 'Bắt buộc cập nhật: máy dùng bản cũ hơn bản này phải cập nhật mới dùng tiếp'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Tests before packaging
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1
          fi
      - run: npm ci
      - run: npm run check

  web:
    name: Signed in-app update (web part)
    needs: check
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mandatory-update floor (signed into the manifest): this version when "required" is ticked,
      # otherwise the floor of the latest release, carried forward so it is never lost.
      - name: Mandatory-update floor
        id: floor
        shell: bash
        env:
          REQUIRED: ${{ inputs.required }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ "$REQUIRED" = "true" ]; then
            v="$VERSION"
          else
            v=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/web-update.json" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).minRequired||'')}catch{}})" || true)
          fi
          echo "main floor: ${v:-none}"
          echo "main=$v" >> "$GITHUB_OUTPUT"
      # One update channel (the high-school pilot edition was removed 2026-10-12).
      - run: npm run build
      - name: Pack and sign
        env:
          WEB_UPDATE_SIGNING_KEY: ${{ secrets.WEB_UPDATE_SIGNING_KEY }}
          RELEASE_NOTES: ${{ inputs.notes }}
          MIN_REQUIRED: ${{ steps.floor.outputs.main }}
        run: node scripts/release/web-bundle.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: web-update
          path: release/
          if-no-files-found: error

  windows:
    name: Build Windows installers
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
      - name: Build installers
        run: npx tauri build
      - name: Collect installers and sizes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe installer/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi installer/
          Get-ChildItem installer |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } |
            Tee-Object -FilePath installer/installer-sizes.txt
      # Artifact "stem-sim-lab-windows": the .exe (recommended), the .msi and their sizes.
      - uses: actions/upload-artifact@v7
        with:
          name: stem-sim-lab-windows
          path: installer/
          if-no-files-found: error
      # Microsoft Store package (unsigned: Microsoft signs it after certification). Skipped
      # until store/identity.json holds the Partner Center identity.
      - name: Store package (MSIX)
        id: msix
        shell: pwsh
        run: |
          $id = Get-Content store/identity.json -Raw | ConvertFrom-Json
          if (-not $id.identityName) {
            Write-Host "::notice::store/identity.json is empty: no Microsoft Store package (docs/STORE.md)"
            "built=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          node scripts/store/make-msix.mjs --out store-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "built=true" >> $env:GITHUB_OUTPUT
      - if: steps.msix.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: simlab-store
          path: store-package/*.msix
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [check, web, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SimLab ${{ needs.check.outputs.version }}
          make_latest: true
          body: |
            ${{ inputs.notes }}

            **Đã cài SimLab:** mở menu ☰ → *Kiểm tra cập nhật* (không cần tải tệp nào).
            **Cài lần đầu:** tải `SimLab_…_x64-setup.exe` (Windows 10/11, 64-bit).
          files: |
            out/stem-sim-lab-windows/*.exe
            out/stem-sim-lab-windows/*.msi
            out/web-update/web-bundle.zip
            out/web-update/web-update.json
          fail_on_unmatched_files: true

  store:
    name: Submit to Microsoft Store
    needs: [check, publish]
    # Only after the first submission was made by hand in Partner Center (docs/STORE.md, step 6).
    if: vars.STORE_SUBMIT == 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: simlab-store
          path: store-package
      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Configure Microsoft Store Developer CLI
        run: >-
          msstore reconfigure
          --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
      - name: Submit the package (Microsoft certifies it before users get it)
        shell: pwsh
        run: |
          $productId = (Get-Content store/identity.json -Raw | ConvertFrom-Json).productId
          if (-not $productId) { Write-Host "::error::store/identity.json has no productId"; exit 1 }
          $msix = (Get-ChildItem store-package/*.msix | Select-Object -First 1).FullName
          msstore publish store-package --inputFile $msix --appId $productId
