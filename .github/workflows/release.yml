name: Release (Windows installer)

# Builds the Windows installers (.exe via NSIS and .msi) on a clean Windows machine.
#
# - Push a tag like `v0.1.0`          → builds and creates a DRAFT GitHub Release with the files.
# - Actions → "Release" → "Run workflow" → builds and attaches the files to the run (Artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Tests before packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  windows:
    name: Build Windows installers
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
      - name: Build installers
        run: npx tauri build
      - name: Collect installers into one folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe installer/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi installer/
          Get-ChildItem installer |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } |
            Tee-Object -FilePath installer/installer-sizes.txt
      # Artifact "stem-sim-lab-windows": a zip with the .exe (recommended), the .msi and the sizes.
      - uses: actions/upload-artifact@v7
        with:
          name: stem-sim-lab-windows
          path: installer/
          if-no-files-found: error
      - name: Draft GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: STEM Sim Lab ${{ github.ref_name }}
          body: |
            Bộ cài Windows 10/11 (64-bit).
            - `STEM Sim Lab_..._x64-setup.exe`: bộ cài khuyên dùng.
            - `STEM Sim Lab_..._x64_en-US.msi`: cho cài đặt hàng loạt (quản trị viên).
            Xem docs/USER_GUIDE.md (mục "Cài đặt").
          files: |
            installer/*.exe
            installer/*.msi
